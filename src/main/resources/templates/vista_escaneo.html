<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light" data-color-theme="Blue_Theme" data-layout="vertical">

<head th:replace="~{layout/head :: head}"></head>

<body>
    <style>
        /* Envuelve y distribuye los botones del selector en pantallas pequeñas */
        .btn-group-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: .5rem;
        }
        .btn-group-wrap .btn {
        flex: 1 1 12rem; /* se apilan si no entra */
        }
        /* Tarjeta: menos sombra y padding en xs */
        .resp-card { border: 0; }
        @media (max-width: 575.98px) {
        .resp-card { box-shadow: none !important; padding: 1rem !important; }
        .title-sm { font-size: 1.075rem; }
        }
        /* Canvas: 4:3 en móvil; 1:1 desde md */
        #qrBox { --bs-aspect-ratio: 75%; }            /* 4:3 */
        @media (min-width: 768px) {
        #qrBox { --bs-aspect-ratio: 100%; }         /* 1:1 */
        }
    </style>
    <div th:replace="~{layout/preloader :: preloader}"></div>
    <header th:replace="~{layout/topbar :: topbar}"></header><br><br><br>
    <main class="container py-4 py-md-5">
        <div
            th:replace="~{layout/card-modulo :: cardFragment('Bienvenido al Sistema...!', 'Inicio', '/vista-administrador', 'Inicio')}">
        </div>

        <div class="row justify-content-center mt-4 mt-md-5">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <section class="shadow-sm resp-card p-3 p-sm-4 rounded-4 border-0 bg-body">
                    <h5 class="text-center mb-2 title-sm">
                        Inspeccionar código de boleto
                    </h5>
                    <p class="text-center text-muted mb-3 mb-sm-4">
                        Elige cómo deseas validar el boleto.
                    </p>

                    <!-- Selector de modo: preparado para envolver en pantallas pequeñas -->
                    <div class="btn-group-wrap w-100 mb-3" role="group" aria-label="Modo de validación">
                        <input type="radio" class="btn-check" name="modoValidacion" id="modoCodigo" autocomplete="off"
                            checked aria-controls="seccionCodigo" />
                        <label class="btn btn-outline-primary" for="modoCodigo">Validar por código</label>

                        <input type="radio" class="btn-check" name="modoValidacion" id="modoCamara" autocomplete="off"
                            aria-controls="seccionCamara" />
                        <label class="btn btn-outline-primary" for="modoCamara">Escanear con cámara</label>
                    </div>

                    <!-- Sección: por código -->
                    <div id="seccionCodigo">
                        <form onsubmit="event.preventDefault(); consultarCodigo();">
                            <div class="input-group input-group-lg mb-2">
                                <input type="text" id="codigoInput" class="form-control"
                                    placeholder="Ingrese el código del boleto" inputmode="numeric" pattern="[0-9]*"
                                    autocomplete="one-time-code" aria-label="Código del boleto" />
                                <button class="btn btn-primary" type="submit">Validar</button>
                            </div>
                            <small class="text-muted">Puedes pegar el código o escribirlo manualmente.</small>
                        </form>
                    </div>

                    <!-- Sección: por cámara -->
                    <div id="seccionCamara" class="mt-3" hidden>
                        <div id="qrBox" class="ratio border rounded-4 overflow-hidden mb-3" style="background: #0f0f0f">
                            <!-- Ajustamos aspecto por CSS (4:3 en móvil, 1:1 en md+) -->
                            <canvas id="qr-canvas" class="w-100 h-100 d-block"></canvas>
                        </div>

                        <!-- Botones: apilados en móvil, en fila en sm+ -->
                        <div class="d-grid gap-2 d-sm-flex">
                            <button id="btnIniciarCam" class="btn btn-success flex-fill" type="button">
                                Iniciar cámara
                            </button>
                            <button id="btnDetenerCam" class="btn btn-danger flex-fill" type="button" disabled>
                                Detener
                            </button>
                        </div>

                        <small class="text-muted d-block mt-2">Apunta la cámara al QR. La detección es
                            automática.</small>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script th:replace="~{layout/script :: script}"></script>
    <audio id="audioScaner" src="../assets/sonido.mp3" preload="auto"></audio>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <script>
        (() => {
        // --- Referencias y estado ---
        const video = document.createElement("video");
        const canvasElement = document.getElementById("qr-canvas");
        const canvas = canvasElement?.getContext ? canvasElement.getContext("2d", { willReadFrequently: true }) : null;

        const seccionCodigo = document.getElementById("seccionCodigo");
        const seccionCamara = document.getElementById("seccionCamara");
        const btnIniciarCam = document.getElementById("btnIniciarCam");
        const btnDetenerCam = document.getElementById("btnDetenerCam");
        const audio = document.getElementById("audioScaner");

        const modoCodigo = document.getElementById("modoCodigo");
        const modoCamara = document.getElementById("modoCamara");
        const codigoInput = document.getElementById("codigoInput");
        const qrBox = document.getElementById("qrBox");

        // Canvas OFFSCREEN para escanear (más chico = más rápido)
        const scanCanvas = document.createElement("canvas");
        const scanCtx = scanCanvas.getContext("2d", { willReadFrequently: true });

        let scanning = false; // cámara corriendo
        let busy = false;     // evitando múltiples lecturas
        let scanLoopTimer = null;

        if (canvas) canvas.imageSmoothingEnabled = false;
        if (scanCtx) scanCtx.imageSmoothingEnabled = false;

        // --- Helpers de ratio ---
        function setBoxRatioFromVideo() {
            if (!qrBox || !video.videoWidth || !video.videoHeight) return;
            const ratioPct = (video.videoHeight / video.videoWidth) * 100; // h/w * 100%
            qrBox.style.setProperty("--bs-aspect-ratio", `${ratioPct.toFixed(2)}%`);
        }

        // --- Mostrar/ocultar secciones accesibles ---
        function mostrarCodigo() {
            seccionCodigo.hidden = false;
            seccionCamara.hidden = true;
            cerrarCamara();
            setTimeout(() => codigoInput?.focus(), 50);
        }
        function mostrarCamara() {
            seccionCodigo.hidden = true;
            seccionCamara.hidden = false;
            encenderCamara();
        }

        // Estado inicial
        if (modoCodigo?.checked) mostrarCodigo();
        if (modoCamara?.checked) mostrarCamara();

        modoCodigo?.addEventListener("change", e => e.target.checked && mostrarCodigo());
        modoCamara?.addEventListener("change", e => e.target.checked && mostrarCamara());

        // --- Cámara: encender / detener ---
        async function encenderCamara() {
            if (!canvas || !canvasElement) {
            Swal.fire("Error", "Canvas de QR no disponible en esta vista.", "error");
            return;
            }
            try {
            // Baja un poco la resolución ideal para fluidez; el contenedor mostrará nítido igual
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 960, max: 1280 },
                height: { ideal: 540, max: 720 }
                },
                audio: false
            });

            scanning = true;
            btnIniciarCam.disabled = true;
            btnDetenerCam.disabled = false;

            video.setAttribute("playsinline", true); // evita fullscreen iOS
            video.srcObject = stream;

            // Espera metadata para conocer dimensiones reales
            await new Promise(res => {
                const ready = () => res();
                video.addEventListener("loadedmetadata", ready, { once: true });
                video.addEventListener("resize", ready, { once: true });
            });

            await video.play();

            // Ajusta el contenedor al ratio real del stream (evita estirado)
            setBoxRatioFromVideo();

            // Empieza a pintar frames (display) usando requestVideoFrameCallback si existe
            startDrawingLoop();

            // Empieza el escaneo en baja resolución offscreen
            startScanLoop();
            } catch (err) {
            console.error("Error al acceder a la cámara: ", err);
            Swal.fire(
                "Error al acceder a la cámara",
                (err && (err.name + ": " + err.message)) || String(err),
                "error"
            );
            btnIniciarCam.disabled = false;
            btnDetenerCam.disabled = true;
            }
        }

        function cerrarCamara() {
            scanning = false;
            if (scanLoopTimer) { clearTimeout(scanLoopTimer); scanLoopTimer = null; }

            if (video.srcObject) {
            video.srcObject.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            }
            btnIniciarCam.disabled = false;
            btnDetenerCam.disabled = true;

            if (canvas && canvasElement) {
            canvas.clearRect(0, 0, canvasElement.width, canvasElement.height);
            }
        }

        btnIniciarCam?.addEventListener("click", encenderCamara);
        btnDetenerCam?.addEventListener("click", cerrarCamara);

        // Pausar si la pestaña no está visible (ahorra batería/CPU)
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
            cerrarCamara();
            } else if (!seccionCamara.hidden && !scanning) {
            encenderCamara();
            }
        });

        // Recalcular ratio en cambio de orientación
        window.addEventListener("orientationchange", () => {
            setTimeout(() => {
            if (scanning) setBoxRatioFromVideo();
            }, 250);
        });

        // --- Pintado del frame (display) ---
        function drawToCanvas() {
            if (!scanning || !video.videoWidth || !video.videoHeight) return;
            // Canvas interno = dimensiones reales del frame (sin distorsión)
            if (canvasElement.width !== video.videoWidth) {
            canvasElement.width = video.videoWidth;
            canvasElement.height = video.videoHeight;
            }
            canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
        }

        function startDrawingLoop() {
            const hasRVFC = "requestVideoFrameCallback" in HTMLVideoElement.prototype;
            if (hasRVFC) {
            const step = () => {
                if (!scanning) return;
                drawToCanvas();
                // @ts-ignore
                video.requestVideoFrameCallback(step);
            };
            // @ts-ignore
            video.requestVideoFrameCallback(step);
            } else {
            const step = () => {
                if (!scanning) return;
                drawToCanvas();
                requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
            }
        }

        // --- Escaneo con jsQR en baja resolución (offscreen) ---
        function startScanLoop() {
            const targetW = 480; // ancho de procesamiento (~12–15fps con móviles comunes)
            const vw = video.videoWidth || 1280;
            const vh = video.videoHeight || 720;
            const ar = vh / vw;
            const targetH = Math.max(1, Math.round(targetW * ar));

            scanCanvas.width = targetW;
            scanCanvas.height = targetH;

            const loop = () => {
            if (!scanning) return;
            try {
                scanCtx.drawImage(video, 0, 0, targetW, targetH);
                const img = scanCtx.getImageData(0, 0, targetW, targetH);
                const found = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
                if (found && found.data) onQrDetected(found.data);
            } catch (_) { /* ignorar */ }
            finally {
                // ~12.5 fps de decodificación; sube/baja si quieres más/menos CPU
                scanLoopTimer = setTimeout(loop, 80);
            }
            };
            loop();
        }

        // --- Manejo cuando se detecta un QR ---
        function onQrDetected(ident) {
            if (!ident || busy) return;
            busy = true;

            // Feedback
            audio?.play().catch(() => {});
            if (navigator.vibrate) navigator.vibrate(80);

            Swal.fire({ title: "Consultando QR...", didOpen: () => Swal.showLoading() });

            fetch("/entradas/validar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ identificador: ident })
            })
            .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
            .then(data => {
            Swal.close();

            if (data.mensaje === "aprobado") {
                Swal.fire("Este QR ya ha sido aprobado");
                busy = false; // mantener cámara encendida
            } else if (data.mensaje === "no_aprobado") {
                Swal.fire({
                title: "Este QR no está aprobado",
                text: "¿Deseas aprobarlo?",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Aprobar",
                cancelButtonText: "Cancelar"
                }).then(res => {
                if (res.isConfirmed) {
                    aprobarQr(ident);
                } else {
                    busy = false;
                }
                });
            } else if (data.mensaje === "no_existe") {
                Swal.fire("El QR no existe, posible falsificación.");
                busy = false;
            } else {
                Swal.fire("Respuesta inesperada del servidor");
                busy = false;
            }
            })
            .catch(err => {
            console.error("Error validando QR:", err);
            Swal.fire("Error validando QR", err.message || String(err), "error");
            busy = false;
            });
        }

        // --- Validación por código (igual que antes, con fallback fetch) ---
        window.consultarCodigo = function consultarCodigo() {
            const codigo = (window.$ ? $("#codigoInput").val() : codigoInput?.value || "").trim();
            if (!codigo) { Swal.fire("Por favor, introduzca un código."); return; }

            Swal.fire({ title: "Consultando código...", didOpen: () => Swal.showLoading() });

            if (window.$) {
            $.ajax({
                url: "/entradas/validar-codigo",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify({ codigo }),
                success: function (data) {
                Swal.close();
                if (data.mensaje === "aprobado") {
                    Swal.fire("Este código ya ha sido aprobado");
                } else if (data.mensaje === "no_aprobado") {
                    Swal.fire({
                    title: "Este código no está aprobado",
                    text: "¿Deseas aprobarlo?",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonText: "Aprobar",
                    cancelButtonText: "Cancelar"
                    }).then((res) => { if (res.isConfirmed) aprobarCodigo(codigo); });
                } else if (data.mensaje === "no_existe") {
                    Swal.fire("El código no existe, posible falsificación.");
                } else {
                    Swal.fire("Respuesta inesperada del servidor");
                }
                if (window.$) $("#codigoInput").val(""); else if (codigoInput) codigoInput.value = "";
                },
                error: function (xhr) {
                const msg = xhr?.responseJSON?.mensaje || xhr?.statusText || "Error";
                console.error("Error validando código:", msg);
                Swal.fire("Error validando código", msg, "error");
                }
            });
            } else {
            fetch("/entradas/validar-codigo", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ codigo })
            })
            .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
            .then(data => {
                Swal.close();
                if (data.mensaje === "aprobado") {
                Swal.fire("Este código ya ha sido aprobado");
                } else if (data.mensaje === "no_aprobado") {
                Swal.fire({
                    title: "Este código no está aprobado",
                    text: "¿Deseas aprobarlo?",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonText: "Aprobar",
                    cancelButtonText: "Cancelar"
                }).then((res) => { if (res.isConfirmed) aprobarCodigo(codigo); });
                } else if (data.mensaje === "no_existe") {
                Swal.fire("El código no existe, posible falsificación.");
                } else {
                Swal.fire("Respuesta inesperada del servidor");
                }
                if (codigoInput) codigoInput.value = "";
            })
            .catch(err => {
                console.error("Error validando código:", err);
                Swal.fire("Error validando código", err.message || String(err), "error");
            });
            }
        };

        window.aprobarCodigo = function aprobarCodigo(codigo) {
            if (window.$) {
            $.ajax({
                url: "/entradas/aprobar-codigo",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify({ codigo }),
                success: (data) => Swal.fire(data.mensaje || "Operación finalizada"),
                error: (xhr) => {
                const msg = xhr?.responseJSON?.mensaje || xhr?.statusText || "Error";
                console.error("Error aprobando código:", msg);
                Swal.fire("Error aprobando código", msg, "error");
                }
            });
            } else {
            fetch("/entradas/aprobar-codigo", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ codigo })
            })
            .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
            .then(d => Swal.fire(d.mensaje || "Operación finalizada"))
            .catch(err => Swal.fire("Error aprobando código", err.message || String(err), "error"));
            }
        };

        window.aprobarQr = function aprobarQr(identificador) {
            fetch("/entradas/aprobar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ identificador })
            })
            .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
            .then(d => Swal.fire(d.mensaje || "Aprobado"))
            .catch(err => Swal.fire("Error aprobando QR", err.message || String(err), "error"))
            .finally(() => { busy = false; });
        };

        // Enter en el input dispara validar
        codigoInput?.addEventListener("keyup", e => {
            if (e.key === "Enter") window.consultarCodigo();
        });

        // Limpia recursos al salir de la página
        window.addEventListener("beforeunload", cerrarCamara);
        })();
    </script>

</body>

</html>
